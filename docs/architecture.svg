<svg width="100%" viewBox="0 0 980 320" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Space Weather Dashboard architecture</title>
  <desc>Data flow from NOAA SWPC through the AWS ETL pipeline, Supabase, the Render-hosted API cache, and the Cloudflare-hosted React frontend</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- NOAA SWPC: external data source -->
  <text x="86" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ccc">NOAA SWPC</text>
  <rect x="10" y="184" width="152" height="88" rx="12" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 4"/>
  <g>
    <rect x="26" y="200" width="120" height="56" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
    <text x="86" y="221" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="rgb(212,211,206)">Space weather</text>
    <text x="86" y="239" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="rgb(212,211,206)">data</text>
  </g>

  <line x1="162" y1="228" x2="206" y2="228" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- AWS: Lambda ETL + S3 raw storage -->
  <text x="292" y="87" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ccc">AWS</text>
  <rect x="206" y="94" width="172" height="178" rx="12" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 4"/>

  <g>
    <rect x="222" y="110" width="140" height="56" rx="8" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
    <text x="292" y="131" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="rgb(125,232,192)">S3</text>
    <text x="292" y="149" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="rgb(45,184,135)">Raw JSON storage</text>
  </g>

  <g>
    <rect x="222" y="200" width="140" height="56" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
    <text x="292" y="221" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="rgb(192,187,255)">Lambda</text>
    <text x="292" y="239" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="rgb(139,130,232)">Scheduled ETL</text>
  </g>

  <line x1="277" y1="200" x2="277" y2="166" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="307" y1="166" x2="307" y2="200" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="378" y1="228" x2="422" y2="228" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Supabase: hosted Postgres, holds transformed data -->
  <text x="498" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ccc">Supabase</text>
  <rect x="422" y="184" width="152" height="88" rx="12" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 4"/>

  <g>
    <rect x="438" y="200" width="120" height="56" rx="8" fill="rgb(39,80,10)" stroke="rgb(151,196,89)" stroke-width="0.5"/>
    <text x="498" y="221" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="rgb(184,232,122)">Postgres DB</text>
    <text x="498" y="239" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="rgb(114,184,58)">Transformed layer</text>
  </g>

  <line x1="574" y1="228" x2="618" y2="228" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Render: FastAPI caching layer -->
  <text x="694" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ccc">Render</text>
  <rect x="618" y="184" width="152" height="88" rx="12" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 4"/>

  <g>
    <rect x="634" y="200" width="120" height="56" rx="8" fill="rgb(12,68,124)" stroke="rgb(133,183,235)" stroke-width="0.5"/>
    <text x="694" y="221" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="rgb(144,200,248)">FastAPI</text>
    <text x="694" y="239" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="rgb(58,143,212)">Caching layer</text>
  </g>

  <line x1="770" y1="228" x2="814" y2="228" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Cloudflare: React frontend -->
  <text x="890" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ccc">Cloudflare</text>
  <rect x="814" y="184" width="152" height="88" rx="12" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 4"/>

  <g>
    <rect x="830" y="200" width="120" height="56" rx="8" fill="rgb(124,64,10)" stroke="rgb(235,158,89)" stroke-width="0.5"/>
    <text x="890" y="221" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="rgb(255,196,140)">React</text>
    <text x="890" y="239" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="rgb(224,132,58)">Frontend (Pages)</text>
  </g>
</svg>
