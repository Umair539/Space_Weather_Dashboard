name: Tests

# Single source of truth for lint + tests. Runs standalone on every push/PR
# to main (no path filter, so nothing slips through untested), and is also
# called as a job by build_api_image.yml/deploy_lambda.yml so their
# build/deploy steps can gate on it without duplicating it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run lint
        run: run_tests lint

      - name: Run all tests
        run: run_tests all
