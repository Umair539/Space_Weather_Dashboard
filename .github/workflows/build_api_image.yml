name: Build & Push API Container

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "docker/api/**"
  workflow_dispatch:

# packages: write is what lets GITHUB_TOKEN push to ghcr.io - no separate
# registry secret needed, unlike the AWS-hosted images elsewhere in this
# repo which need OIDC role assumption.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, tag, and push image
        run: |
          # ghcr.io requires a lowercase path; github.repository_owner
          # ("Umair539") isn't guaranteed to already be one.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/$OWNER/space-weather-api"
          SHORT_SHA=${GITHUB_SHA::7}

          docker build -f docker/api/Dockerfile -t "$IMAGE_URI:$SHORT_SHA" -t "$IMAGE_URI:latest" .
          docker push "$IMAGE_URI:$SHORT_SHA"
          docker push "$IMAGE_URI:latest"

          # Handed to the deploy step so Render is pointed at this exact
          # build rather than resolving :latest a second time.
          echo "IMAGE_REF=$IMAGE_URI:$SHORT_SHA" >> "$GITHUB_ENV"

      # Render does not watch the registry - an image-backed service keeps
      # serving its current image until something explicitly asks it to
      # redeploy, so without this the push above would never reach prod.
      - name: Deploy to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set - image pushed but Render was not redeployed."
            exit 1
          fi

          # The hook URL already carries its own ?key=, so -G appends with &.
          # --data-urlencode matters: imgURL contains / and : characters.
          curl -fsS --retry 3 --retry-delay 5 -G \
            --data-urlencode "imgURL=$IMAGE_REF" \
            "$DEPLOY_HOOK" > /dev/null

          echo "Render deploy triggered for $IMAGE_REF"
